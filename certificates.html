  :root { --navy:#14213D; --teal:#0B7F6E; --gold:#B8862B; --ink:#22293A; --mute:#5A6780; }

  .panel { max-width:980px; margin:24px auto; background:#fff; border-radius:14px; padding:22px 26px; font-family:"Segoe UI", system-ui, Arial, sans-serif; box-shadow:0 6px 20px rgba(20,33,61,.08); }

  table.sum th { color:#B45309; }
  /* ---------- certificate page: A4 landscape ---------- */
  .cert { width:297mm; height:210mm; box-sizing:border-box; margin:16px auto; background:#FBFAF6; position:relative; page-break-after:always; break-after:page; box-shadow:0 6px 20px rgba(20,33,61,.12); overflow:hidden; }
  .cert .b1 { position:absolute; inset:7.5mm; border:2.1mm solid var(--navy); }
  .cert .b2 { position:absolute; inset:12mm; border:0.5mm solid var(--gold); }

  .cert .dept { font-size:11.5pt; letter-spacing:.06em; color:var(--mute); font-weight:600; margin-top:3mm; }
  .cert .title { font-size:38pt; font-weight:700; color:var(--navy); margin:4mm 0 0; line-height:1.1; }
  .cert .rule { width:85mm; height:0.35mm; background:var(--gold); margin:3mm 0 4mm; }

  .cert .usn { font-size:13pt; font-weight:600; color:var(--mute); margin-top:0; }

  .cert .rating { font-size:17pt; margin-top:4mm; }

  .cert .stars { margin-top:2mm; height:9mm; }
  .cert .appr { font-style:italic; font-size:14.5pt; color:var(--mute); margin:3mm 30mm 0; line-height:1.3; }
  .cert .sigs { position:absolute; left:0; right:0; bottom:9mm; display:flex; justify-content:space-around; }

  .cert .sig span { font-size:10.5pt; color:var(--mute); display:block; line-height:1.3; }

  @media print {
    body { background:#fff; }
    .panel { display:none; }

<script>
const RATINGS = {
  "Outstanding":  [5, "Certificate of Excellence",     "In appreciation of exceptional skill in embedded programming and an outstanding solution to the Smart Street Light design challenge."],
  "Excellent":    [4, "Certificate of Achievement",    "In appreciation of excellent performance across the hands-on labs and the design challenge."],
  "Very Good":    [3, "Certificate of Achievement",    "In appreciation of very good performance and steady progress through the hands-on labs."],
  "Good":         [2, "Certificate of Merit",          "In appreciation of good effort and active participation in the hands-on labs."],
  "Participated": [1, "Certificate of Participation",  "In appreciation of participation in the hands-on labs."]
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('hod').value = WS.hodName || ''; $('hodt').value = WS.hodTitle || 'Professor & HOD, Dept. of ECE';
$('sdc').value = WS.sdcName || ''; $('sdct').value = WS.sdcTitle || 'Convener, Skill Development Cell';

function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.replace(/^﻿/, '').trim());
  return rows.filter(r => r.some(x => x.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
}
const pick = (r, ...keys) => { for (const k of keys) { const hit = Object.keys(r).find(h => h.toLowerCase().startsWith(k.toLowerCase())); if (hit && r[hit]) return r[hit]; } return ''; };
function ratingFor(total) { const t = parseFloat(total); if (isNaN(t)) return 'Participated';
  return t >= 85 ? 'Outstanding' : t >= 70 ? 'Excellent' : t >= 55 ? 'Very Good' : t >= 40 ? 'Good' : 'Participated'; }
function stars(n) {
  const pts = [...Array(10)].map((_, i) => { const a = Math.PI/2 + i*Math.PI/5, r = i % 2 ? 4.2 : 10; return [12 + r*Math.cos(a), 12 - r*Math.sin(a)].map(v => v.toFixed(2)).join(','); }).join(' ');
  return [...Array(5)].map((_, i) => `<svg width="9mm" height="9mm" viewBox="0 0 24 24"><polygon points="${pts}" fill="${i < n ? '#B8862B' : 'none'}" stroke="#B8862B" stroke-width="1.2"/></svg>`).join('');
}
function cert(r, sample) {
  let rating = pick(r, 'Rating'); const total = pick(r, 'Total');
  if (!RATINGS[rating]) rating = ratingFor(total);
  const [n, title, appr] = RATINGS[rating];
  const name = pick(r, 'Name'), usn = pick(r, 'USN'), no = pick(r, 'Certificate');
  const nameSize = name.length > 26 ? 36 : name.length > 20 ? 42 : 46;
  const score = total && !isNaN(parseFloat(total)) ? ` &nbsp;·&nbsp; Score ${Math.round(parseFloat(total))}/100` : '';
  return `<section class="cert">
    <div class="b1"></div><div class="b2"></div>
    ${[[12,12],[12,null],[null,12],[null,null]].map(([l,t]) => `<div class="dot" style="${l!==null?'left:10.6mm':'right:10.6mm'};${t!==null?'top:10.6mm':'bottom:10.6mm'}"></div>`).join('')}
    <div class="inner">
      <div class="dept">SKILL DEVELOPMENT CELL &amp; DEPARTMENT OF ECE &nbsp;·&nbsp; NAVKIS COLLEGE OF ENGINEERING, HASSAN</div>
      <div class="title">${title}</div><div class="rule"></div>
      <div class="certify">This is to certify that</div>
      <div class="name" style="font-size:${nameSize}pt">${esc(name)}</div>
      ${usn ? `<div class="usn">USN: ${esc(usn)}</div>` : ''}
      <div class="body">successfully took part in the one-day hands-on workshop “From Code to Silicon: Blink. Sense. Connect.” on embedded systems with the ESP32 microcontroller, held on 25 November 2026.</div>
      <div class="rating">Performance rating: <b>${rating.toUpperCase()}</b>${score}</div>
      <div class="stars">${stars(n)}</div>
      <div class="appr">${appr}</div>
      <div class="sigs">
        <div class="sig"><div class="line"></div><b>Dr. Sathisha R N</b><span>Resource Person</span><span>Assistant Professor, Dept. of ETE</span><span>Siddaganga Institute of Technology, Tumakuru</span></div>
        <div class="sig"><div class="line"></div><b>${esc($('sdc').value)}</b><span>${esc($('sdct').value)}</span><span>NAVKIS College of Engineering, Hassan</span></div>
        <div class="sig"><div class="line"></div><b>${esc($('hod').value)}</b><span>${esc($('hodt').value)}</span><span>NAVKIS College of Engineering, Hassan</span></div>
      </div>
    </div>
    ${no ? `<div class="no">Certificate No. ${esc(no)}</div>` : ''}<div class="place">Hassan, 25 November 2026</div>
    ${sample ? '<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:110pt;font-weight:700;color:rgba(194,38,75,.10);transform:rotate(-18deg);pointer-events:none">SAMPLE</div>' : ''}
  </section>`;
}
let ROWS = [], SAMPLE = false;
function render() {
  const rows = ROWS.filter(r => pick(r, 'Name'));
  $('certs').innerHTML = rows.map(r => cert(r, SAMPLE)).join('');
  const counts = {}; rows.forEach(r => { let k = pick(r, 'Rating'); if (!RATINGS[k]) k = ratingFor(pick(r, 'Total')); counts[k] = (counts[k] || 0) + 1; });
  $('status').textContent = rows.length ? `${rows.length} certificate(s) ready` + (SAMPLE ? ' (samples)' : '') : 'No rows with a Name column found.';
  $('summary').innerHTML = rows.length ? '<table class="sum"><tr><th>Rating</th><th>Students</th></tr>' + Object.keys(RATINGS).filter(k => counts[k]).map(k => `<tr><td>${k}</td><td>${counts[k]}</td></tr>`).join('') + '</table>' : '';
}
function load(text) { ROWS = parseCSV(text); SAMPLE = false; render(); }
$('file').onchange = e => { const f = e.target.files[0]; if (f) f.text().then(load); };
$('usepaste').onclick = () => load($('paste').value);
$('fetch').onclick = () => { if (!WS.gradebookCsvUrl) { alert('Set gradebookCsvUrl in config.js first, or upload the CSV file.'); return; }
  $('status').textContent = 'Loading…'; fetch(WS.gradebookCsvUrl).then(r => r.text()).then(load).catch(() => $('status').textContent = 'Could not load the published Sheet — upload the CSV file instead.'); };
$('hod').oninput = $('hodt').oninput = () => ROWS.length && render();
$('sample').onclick = () => { ROWS = [
  { Name: 'Ananya Gowda', USN: '4NA23CS001', Total: '97.3', Rating: 'Outstanding', 'Certificate No': 'NAVKIS-EWS26-001' },
  { Name: 'Bharath Kumar M', USN: '4NA23CS014', Total: '75.8', Rating: 'Excellent', 'Certificate No': 'NAVKIS-EWS26-002' },
  { Name: 'Chaitra Shivaprasad Hiremath', USN: '4NA23CS021', Total: '44.3', Rating: 'Good', 'Certificate No': 'NAVKIS-EWS26-003' }]; SAMPLE = true; render(); };
$('print').onclick = () => { if (!document.querySelector('.cert')) { alert('Load the gradebook first.'); return; } window.print(); };
</script>
</body></html>
