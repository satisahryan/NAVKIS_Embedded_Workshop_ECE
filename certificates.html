  :root { --navy:#14213D; --teal:#0B7F6E; --gold:#B8862B; --ink:#22293A; --mute:#5A6780; }
  body { margin:0; font-family:"CertSerif", Georgia, "Times New Roman", serif; background:#E9ECF2; color:var(--ink); }
  .panel { max-width:980px; margin:24px auto; background:#fff; border-radius:14px; padding:22px 26px; font-family:"Segoe UI", system-ui, Arial, sans-serif; box-shadow:0 6px 20px rgba(20,33,61,.08); }
  .panel h1 { margin:0 0 6px; font-size:24px; color:var(--navy); }
  .panel p { color:#4A5568; margin:6px 0; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:12px 0; }
  .row label { font-weight:600; font-size:14px; }
  input[type=text] { padding:8px 10px; border:1px solid #CBD3E1; border-radius:8px; font-size:14px; min-width:260px; }
  textarea { width:100%; height:90px; border:1px solid #CBD3E1; border-radius:8px; padding:8px; font-family:Consolas, monospace; font-size:12px; box-sizing:border-box; }
  button { background:var(--teal); color:#fff; border:0; border-radius:9px; padding:10px 16px; font-size:15px; font-weight:700; cursor:pointer; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid #CBD3E1; }
  #status { font-weight:600; color:var(--teal); }
  table.sum { border-collapse:collapse; width:100%; font-size:13px; margin-top:10px; }
  table.sum th, table.sum td { border-bottom:1px solid #E2E8F0; padding:5px 8px; text-align:left; }
  table.sum th { color:#B45309; }
  /* ---------- certificate page: A4 landscape ---------- */
  .cert { width:297mm; height:210mm; box-sizing:border-box; margin:16px auto; background:#FBFAF6; position:relative; page-break-after:always; break-after:page; box-shadow:0 6px 20px rgba(20,33,61,.12); overflow:hidden; }
  .cert .b1 { position:absolute; inset:7.5mm; border:2.1mm solid var(--navy); }
  .cert .b2 { position:absolute; inset:12mm; border:0.5mm solid var(--gold); }
  .cert .dot { position:absolute; width:2.8mm; height:2.8mm; border-radius:50%; background:var(--gold); }
  .cert .inner { position:absolute; inset:16mm 22mm 14mm; text-align:center; display:flex; flex-direction:column; align-items:center; }
  .cert .logo { height:19mm; width:auto; margin-top:0; }
  .cert .dept { font-size:11.5pt; letter-spacing:.06em; color:var(--mute); font-weight:600; margin-top:2mm; }
  .cert .title { font-size:36pt; font-weight:700; color:var(--navy); margin:2mm 0 0; line-height:1.1; }
  .cert .rule { width:85mm; height:0.35mm; background:var(--gold); margin:3mm 0 4mm; }
  .cert .certify { font-style:italic; font-size:16pt; }
  .cert .name { font-family:"CertScript", "Brush Script MT", cursive; font-size:46pt; color:var(--navy); line-height:1.3; margin:2.5mm 0 0; white-space:nowrap; word-spacing:0.18em; }
  .cert .usn { font-size:13pt; font-weight:600; color:var(--mute); margin-top:0; }
  .cert .body { font-size:15.5pt; line-height:1.32; margin:3mm 18mm 0; }
  .cert .rating { font-size:17pt; margin-top:4mm; }
  .cert .rating b { color:var(--teal); letter-spacing:.03em; }
  .cert .stars { margin-top:2mm; height:9mm; }
  .cert .appr { font-style:italic; font-size:14.5pt; color:var(--mute); margin:3mm 30mm 0; line-height:1.3; }
  .cert .sigs { position:absolute; left:0; right:0; bottom:9mm; display:flex; justify-content:space-around; }
  .cert .sig { width:82mm; text-align:center; }
  .cert .sig .line { border-top:0.3mm solid var(--ink); margin-bottom:2mm; }
  .cert .sig b { font-size:13.5pt; display:block; }
  .cert .sig span { font-size:10.5pt; color:var(--mute); display:block; line-height:1.3; }
  .cert .no { position:absolute; left:17mm; bottom:14.5mm; font-size:9.5pt; color:var(--mute); }
  .cert .place { position:absolute; right:17mm; bottom:14.5mm; font-size:9.5pt; color:var(--mute); }
  @page { size: A4 landscape; margin: 0; }
  @media print {
    body { background:#fff; }
    .panel { display:none; }
    .cert { margin:0; box-shadow:none; }

<div class="panel">
  <h1>Workshop certificates</h1>
  <p>Load the <b>Gradebook</b> tab as CSV (Google Sheet &rarr; File &rarr; Download &rarr; Comma-separated values), check the preview, then press <b>Print</b>. Choose <b>A4, Landscape, Margins: None</b>, and tick <b>Background graphics</b>.</p>
  <div class="row">
    <label>Gradebook CSV file <input type="file" id="file" accept=".csv,text/csv"></label>
    <button class="ghost" id="fetch" title="Uses gradebookCsvUrl in config.js">Load from published Sheet</button>
  </div>
  <details><summary style="cursor:pointer;font-weight:600">…or paste CSV</summary><textarea id="paste" placeholder="S.No,Name,USN,Quiz /15,Labs /6,Challenge /13,Participation /5,Total,Rating,Certificate No"></textarea><button class="ghost" id="usepaste">Use pasted CSV</button></details>
  <div class="row">
    <label>HoD name <input type="text" id="hod"></label>
    <label>HoD title <input type="text" id="hodt"></label>
  </div>
  <div class="row">
    <label>SDC name <input type="text" id="sdc"></label>
    <label>SDC title <input type="text" id="sdct"></label>
  </div>

  <div id="summary"></div>
</div>
<div id="certs"></div>
<script>
const RATINGS = {
  "Outstanding":  [5, "Certificate of Excellence",     "In appreciation of exceptional skill in embedded programming and an outstanding solution to the Smart Street Light design challenge."],
  "Excellent":    [4, "Certificate of Achievement",    "In appreciation of excellent performance across the hands-on labs and the design challenge."],
  "Very Good":    [3, "Certificate of Achievement",    "In appreciation of very good performance and steady progress through the hands-on labs."],
  "Good":         [2, "Certificate of Merit",          "In appreciation of good effort and active participation in the hands-on labs."],
  "Participated": [1, "Certificate of Participation",  "In appreciation of participation in the hands-on labs."]
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('hod').value = WS.hodName || ''; $('hodt').value = WS.hodTitle || 'Professor & HOD, Dept. of ECE';
$('sdc').value = WS.sdcName || ''; $('sdct').value = WS.sdcTitle || 'Convener, Skill Development Cell';

function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.replace(/^﻿/, '').trim());
  return rows.filter(r => r.some(x => x.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
}
const pick = (r, ...keys) => { for (const k of keys) { const hit = Object.keys(r).find(h => h.toLowerCase().startsWith(k.toLowerCase())); if (hit && r[hit]) return r[hit]; } return ''; };
function ratingFor(total) { const t = parseFloat(total); if (isNaN(t)) return 'Participated';
  return t >= 85 ? 'Outstanding' : t >= 70 ? 'Excellent' : t >= 55 ? 'Very Good' : t >= 40 ? 'Good' : 'Participated'; }
function stars(n) {
  const pts = [...Array(10)].map((_, i) => { const a = Math.PI/2 + i*Math.PI/5, r = i % 2 ? 4.2 : 10; return [12 + r*Math.cos(a), 12 - r*Math.sin(a)].map(v => v.toFixed(2)).join(','); }).join(' ');
  return [...Array(5)].map((_, i) => `<svg width="9mm" height="9mm" viewBox="0 0 24 24"><polygon points="${pts}" fill="${i < n ? '#B8862B' : 'none'}" stroke="#B8862B" stroke-width="1.2"/></svg>`).join('');
}
// "SATHISHA R N" or "sathisha r.n." -> "Sathisha R N" / "Sathisha R.N."; script capitals look bad
function nice(n) {
  return String(n || '').trim().replace(/\s+/g, ' ').split(' ').map(w =>
    (w.length <= 2 || w.includes('.')) ? w.toUpperCase()
      : w.toLowerCase().replace(/(^|[-'])([a-z])/g, (m, p, c) => p + c.toUpperCase())).join(' ');
}
function cert(r, sample) {
